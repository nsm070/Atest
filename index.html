<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>제어기 통합 시뮬레이터</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; }
    h1, h2 { text-align: center; }
    label { display: block; margin-top: 10px; }
    input[type=range] { width: 100%; }
    .tab { display: none; }
    .tab.active { display: block; }
    nav { text-align: center; margin-bottom: 20px; }
    nav button { margin: 0 10px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>

<h1>🔧 제어기 통합 시뮬레이터</h1>

<nav>
  <button onclick="showTab('pid')">PID 제어기</button>
  <button onclick="showTab('lqr')">LQR 제어기</button>
</nav>

<div id="pid" class="tab active">
  <h2>PID 제어기</h2>
  <label>Kp: <span id="kpVal">2.0</span></label>
  <input type="range" id="Kp" min="0" max="10" step="0.1" value="2.0" />

  <label>Ki: <span id="kiVal">1.0</span></label>
  <input type="range" id="Ki" min="0" max="5" step="0.1" value="1.0" />

  <label>Kd: <span id="kdVal">0.5</span></label>
  <input type="range" id="Kd" min="0" max="5" step="0.1" value="0.5" />
  <canvas id="pidChart"></canvas>
</div>

<div id="lqr" class="tab">
  <h2>LQR 제어기</h2>
  <label>Q (상태 가중치): <span id="qVal">1.0</span></label>
  <input type="range" id="Q" min="0.1" max="5.0" step="0.1" value="1.0" />

  <label>R (입력 가중치): <span id="rVal">1.0</span></label>
  <input type="range" id="R" min="0.1" max="5.0" step="0.1" value="1.0" />
  <canvas id="lqrChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function showTab(id) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const t = Array.from({length: 500}, (_, i) => i * 0.02);
const dt = 0.02;
const zeta = 0.6;
const wn = 2.0;

// PID 시뮬레이션
function simulatePID(Kp, Ki, Kd) {
  let y = 0, y_dot = 0;
  let integral = 0;
  let prev_error = 1;
  const response = [];
  for (let i = 0; i < t.length; i++) {
    const error = 1 - y;
    integral += error * dt;
    const derivative = (error - prev_error) / dt;
    const u = Kp * error + Ki * integral + Kd * derivative;
    prev_error = error;
    const y_ddot = u - 2 * zeta * wn * y_dot - wn ** 2 * y;
    y_dot += y_ddot * dt;
    y += y_dot * dt;
    response.push(y);
  }
  return response;
}

const pidCtx = document.getElementById("pidChart").getContext("2d");
const pidChart = new Chart(pidCtx, {
  type: 'line',
  data: {
    labels: t,
    datasets: [{
      label: 'PID 응답',
      data: [],
      borderColor: 'blue',
      fill: false
    }]
  },
  options: {
    scales: {
      x: { title: { display: true, text: '시간 (s)' } },
      y: { title: { display: true, text: '출력 y(t)' }, min: -0.5, max: 2 }
    }
  }
});

function updatePID() {
  const Kp = parseFloat(document.getElementById("Kp").value);
  const Ki = parseFloat(document.getElementById("Ki").value);
  const Kd = parseFloat(document.getElementById("Kd").value);
  document.getElementById("kpVal").textContent = Kp;
  document.getElementById("kiVal").textContent = Ki;
  document.getElementById("kdVal").textContent = Kd;
  const y = simulatePID(Kp, Ki, Kd);
  pidChart.data.datasets[0].data = y;
  pidChart.update();
}

// LQR 시뮬레이션
const A = [[0, 1], [0, -1]];
const B = [[0], [1]];
const C = [1, 0];
const x0 = [1, 0];

function simulateLQR(Qval, Rval) {
  const K = [Qval, Rval];
  let x = [...x0];
  const output = [];
  for (let i = 0; i < t.length; i++) {
    const u = -K[0]*x[0] - K[1]*x[1];
    const dx1 = x[1];
    const dx2 = -x[1] + u;
    x[0] += dx1 * dt;
    x[1] += dx2 * dt;
    const y = C[0]*x[0] + C[1]*x[1];
    output.push(y);
  }
  return output;
}

const lqrCtx = document.getElementById("lqrChart").getContext("2d");
const lqrChart = new Chart(lqrCtx, {
  type: 'line',
  data: {
    labels: t,
    datasets: [{
      label: 'LQR 응답',
      data: [],
      borderColor: 'green',
      fill: false
    }]
  },
  options: {
    scales: {
      x: { title: { display: true, text: '시간 (s)' } },
      y: { title: { display: true, text: '출력 y(t)' }, min: -0.5, max: 2 }
    }
  }
});

function updateLQR() {
  const Q = parseFloat(document.getElementById("Q").value);
  const R = parseFloat(document.getElementById("R").value);
  document.getElementById("qVal").textContent = Q;
  document.getElementById("rVal").textContent = R;
  const y = simulateLQR(Q, R);
  lqrChart.data.datasets[0].data = y;
  lqrChart.update();
}

document.querySelectorAll("input").forEach(input => {
  input.addEventListener("input", () => {
    if (input.id.startsWith("K")) updatePID();
    if (input.id.startsWith("Q") || input.id.startsWith("R")) updateLQR();
  });
});

updatePID();
updateLQR();
</script>

</body>
</html>
