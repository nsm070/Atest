<style>
:root{
  --paper:#F0EBF3; --paper-deep:#E1DAEA;
  --ink:#221942; --ink-soft:#6B6289;
  --riso-pink:#FF5C8A; --riso-blue:#4C7CF7; --riso-yellow:#FFC44D; --riso-mint:#2FCFB4;
  --display:"Bagel Fat One", system-ui, sans-serif;
  --body:"Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, monospace;
  --shift:5px; --edge:3px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.65;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:radial-gradient(circle at center, rgba(34,25,66,.13) 1px, transparent 1.1px);
  background-size:5px 5px;mix-blend-mode:multiply;opacity:.5}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

.masthead{padding:26px 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--display);font-size:20px;line-height:1}
.brand em{font-style:normal;color:var(--riso-pink)}
.plate{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}

.overprint{position:relative;display:inline-block;font-family:var(--display);line-height:1.02;letter-spacing:-.02em}
.overprint::before{content:attr(data-text);position:absolute;left:calc(var(--shift) * -1);top:var(--shift);
  color:var(--riso-pink);mix-blend-mode:multiply;z-index:-1;white-space:pre-wrap}

.cover{padding:18px 0 34px}
.cover h1{font-size:clamp(40px,12.5vw,68px);margin-bottom:20px}
.cover p{font-size:15px;color:var(--ink-soft);max-width:30ch}
.regbar{display:flex;height:9px;margin:26px 0 8px;border:var(--edge)}
.regbar span{flex:1}
.regbar span:nth-child(1){background:var(--riso-pink)}
.regbar span:nth-child(2){background:var(--riso-blue)}
.regbar span:nth-child(3){background:var(--riso-yellow)}
.regbar span:nth-child(4){background:var(--riso-mint)}

.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-soft);margin:30px 0 14px}
.rack{display:grid;gap:14px;padding-bottom:8px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--paper);
  border:var(--edge);padding:18px;font:inherit;color:inherit;
  transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s;
  box-shadow:var(--shift) var(--shift) 0 var(--ink)}
.card:hover,.card:focus-visible{transform:translate(calc(var(--shift) * -1), calc(var(--shift) * -1));box-shadow:calc(var(--shift) * 2) calc(var(--shift) * 2) 0 var(--ink)}
.card:active{transform:translate(0,0);box-shadow:0 0 0 var(--ink)}
.card:focus-visible{outline:3px solid var(--riso-blue);outline-offset:4px}
.card canvas{flex:none;width:74px;height:74px}
.card-body{min-width:0}
.card-no{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-soft)}
.card h2{font-family:var(--display);font-size:24px;line-height:1.15;margin:4px 0;font-weight:400}
.card p{font-size:13px;color:var(--ink-soft);line-height:1.45}
.card[data-ink="pink"]{background:color-mix(in srgb, var(--riso-pink) 15%, var(--paper))}
.card[data-ink="blue"]{background:color-mix(in srgb, var(--riso-blue) 13%, var(--paper))}
.card[data-ink="yellow"]{background:color-mix(in srgb, var(--riso-yellow) 24%, var(--paper))}
.card[data-ink="mint"]{background:color-mix(in srgb, var(--riso-mint) 17%, var(--paper))}

.quiz-top{padding:20px 0 6px}
.back{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px 0}
.back:hover{color:var(--ink)}
.gauge{height:9px;border:var(--edge);display:flex;overflow:hidden;margin:8px 0 4px}
.gauge i{display:block;background:var(--riso-pink);width:0;transition:width .3s cubic-bezier(.2,.8,.3,1)}
.gauge-txt{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:26px}
.qbody{animation:slidein .28s cubic-bezier(.2,.8,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qtext{font-family:var(--display);font-size:clamp(24px,7vw,34px);line-height:1.3;font-weight:400;margin-bottom:26px}
.choices{display:grid;gap:12px}
.choice{font:inherit;text-align:left;cursor:pointer;background:var(--paper);border:var(--edge);
  padding:17px 18px;font-size:15.5px;line-height:1.45;display:flex;gap:13px;align-items:flex-start;
  transition:transform .13s, background .13s}
.choice:hover,.choice:focus-visible{background:var(--paper-deep);transform:translateX(4px)}
.choice:focus-visible{outline:3px solid var(--riso-blue);outline-offset:3px}
.choice b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink-soft);padding-top:3px;flex:none}

.result-head{padding:22px 0 0}
.stamp{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;border:2px solid var(--ink);padding:5px 10px;margin-bottom:14px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.hero canvas{flex:none;width:150px;height:150px}
.hero-num{min-width:0}
.score-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:2px}
.score{font-family:var(--display);font-size:clamp(50px,15vw,74px);line-height:1;letter-spacing:-.03em;display:flex;align-items:baseline;gap:4px}
.score em{font-style:normal;font-size:.4em;color:var(--riso-pink)}
.score-bar{height:24px;border:var(--edge);margin:4px 0 6px;padding:3px}
.score-bar i{display:block;height:100%;background:var(--riso-pink);width:0;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.score-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:28px}

.type-code{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--riso-pink);margin-bottom:4px}
.type-name{font-size:clamp(36px,11vw,58px);margin-bottom:16px}
.type-line{font-size:16px;font-weight:600;margin-bottom:10px}
.type-desc{font-size:15px;color:var(--ink-soft);margin-bottom:24px}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.traits span{font-family:var(--mono);font-size:11.5px;border:2px solid var(--ink);padding:5px 10px}
.panel{border:var(--edge);padding:16px 17px;margin-bottom:12px;box-shadow:var(--shift) var(--shift) 0 var(--ink)}
.panel h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:7px;font-weight:400}
.panel p{font-size:14.5px;line-height:1.6}
.panel.good{background:color-mix(in srgb, var(--riso-mint) 17%, var(--paper))}
.panel.warn{background:color-mix(in srgb, var(--riso-yellow) 25%, var(--paper))}

.preview{width:100%;border:var(--edge);margin:26px 0 16px;display:block;background:var(--paper)}
.actions{display:grid;gap:11px;margin-bottom:30px}
.btn{font:inherit;font-weight:700;font-size:15.5px;cursor:pointer;padding:16px;border:var(--edge);
  background:var(--paper);color:var(--ink);box-shadow:var(--shift) var(--shift) 0 var(--ink);
  transition:transform .13s, box-shadow .13s}
.btn:hover,.btn:focus-visible{transform:translate(calc(var(--shift) * -1), calc(var(--shift) * -1));box-shadow:calc(var(--shift) * 2) calc(var(--shift) * 2) 0 var(--ink)}
.btn:active{transform:translate(0,0);box-shadow:0 0 0}
.btn:focus-visible{outline:3px solid var(--riso-blue);outline-offset:4px}
.btn.primary{background:var(--riso-pink);color:#fff}
.btn.ghost{box-shadow:none;background:transparent;font-weight:500}
.btn.ghost:hover{transform:none;box-shadow:none;background:var(--paper-deep)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--ink);color:var(--paper);
  padding:12px 20px;font-family:var(--mono);font-size:12.5px;z-index:10000;opacity:0;
  transition:all .28s cubic-bezier(.2,.8,.3,1);pointer-events:none;max-width:calc(100% - 36px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.adslot{margin:28px 0;min-height:1px}
.adslot ins{display:block}
footer{border-top:var(--edge);margin-top:34px;padding:20px 0 42px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);line-height:1.9}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .card:hover,.btn:hover,.choice:hover{transform:none}
}
</style>
</head>

const INK="#221942", SOFT="#6B6289", PAPER="#F0EBF3";

/* ══ 색 보조 ══ */
function h2r(h){h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixc(hex,base,t){const a=h2r(hex),b=h2r(base);
  return `rgb(${Math.round(a[0]*t+b[0]*(1-t))},${Math.round(a[1]*t+b[1]*(1-t))},${Math.round(a[2]*t+b[2]*(1-t))})`}
function rr(x,px,py,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();
  x.moveTo(px+r,py);x.lineTo(px+w-r,py);x.quadraticCurveTo(px+w,py,px+w,py+r);
  x.lineTo(px+w,py+h-r);x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);
  x.lineTo(px+r,py+h);x.quadraticCurveTo(px,py+h,px,py+h-r);
  x.lineTo(px,py+r);x.quadraticCurveTo(px,py,px+r,py);x.closePath()}

/* ══════════════════════════════════════════
   캐릭터 — 파라미터로 조합되는 리소풍 마스코트
   ══════════════════════════════════════════ */
function drawChar(x,cx,cy,s,spec,A){
  const lw=Math.max(2,s*0.075);
  x.save();x.lineJoin="round";x.lineCap="round";

  // 반짝임
  x.fillStyle=A;
  [[-1.25,-.85,.16],[1.2,-1.0,.12],[1.35,.35,.09]].forEach(p=>{
    sparkle(x,cx+s*p[0],cy+s*p[1],s*p[2]);
  });

  // 그림자
  x.fillStyle="rgba(34,25,66,0.10)";
  x.beginPath();x.ellipse(cx,cy+s*1.05,s*0.8,s*0.15,0,0,7);x.fill();

  // 머리 장식 (몸 뒤)
  x.strokeStyle=INK;x.lineWidth=lw;x.fillStyle=A;
  if(spec.tuft==="antenna"){
    x.beginPath();x.moveTo(cx,cy-s*0.85);x.quadraticCurveTo(cx+s*0.1,cy-s*1.25,cx+s*0.28,cy-s*1.3);x.stroke();
    x.beginPath();x.arc(cx+s*0.3,cy-s*1.34,s*0.13,0,7);x.fill();x.stroke();
  }else if(spec.tuft==="heart"){
    heart(x,cx,cy-s*1.18,s*0.3);x.fill();x.stroke();
  }else if(spec.tuft==="leaf"){
    x.beginPath();x.moveTo(cx-s*0.05,cy-s*0.9);
    x.quadraticCurveTo(cx+s*0.35,cy-s*1.4,cx+s*0.42,cy-s*1.05);
    x.quadraticCurveTo(cx+s*0.2,cy-s*0.85,cx-s*0.05,cy-s*0.9);x.closePath();x.fill();x.stroke();
  }else if(spec.tuft==="curl"){
    x.beginPath();x.moveTo(cx-s*0.05,cy-s*0.88);
    x.bezierCurveTo(cx-s*0.1,cy-s*1.35,cx+s*0.45,cy-s*1.3,cx+s*0.22,cy-s*1.0);x.stroke();
  }else if(spec.tuft==="bow"){
    x.beginPath();x.ellipse(cx-s*0.4,cy-s*0.78,s*0.2,s*0.15,-0.4,0,7);x.fill();x.stroke();
    x.beginPath();x.ellipse(cx-s*0.02,cy-s*0.78,s*0.2,s*0.15,0.4,0,7);x.fill();x.stroke();
    x.beginPath();x.arc(cx-s*0.21,cy-s*0.8,s*0.08,0,7);x.fillStyle=mixc(A,INK,.6);x.fill();x.stroke();
  }

  // 몸통
  x.beginPath();
  x.moveTo(cx-s*0.8,cy+s*0.05);
  x.bezierCurveTo(cx-s*0.82,cy-s*1.02,cx+s*0.82,cy-s*1.02,cx+s*0.8,cy+s*0.05);
  x.bezierCurveTo(cx+s*0.86,cy+s*0.98,cx-s*0.86,cy+s*0.98,cx-s*0.8,cy+s*0.05);
  x.closePath();
  x.fillStyle=mixc(A,PAPER,spec.tint);x.fill();
  x.strokeStyle=INK;x.lineWidth=lw;x.stroke();

  // 팔
  x.beginPath();x.moveTo(cx-s*0.78,cy+s*0.28);x.quadraticCurveTo(cx-s*0.98,cy+s*0.4,cx-s*0.88,cy+s*0.58);x.stroke();
  x.beginPath();x.moveTo(cx+s*0.78,cy+s*0.28);x.quadraticCurveTo(cx+s*0.98,cy+s*0.4,cx+s*0.88,cy+s*0.58);x.stroke();

  // 볼터치
  x.fillStyle=A;x.globalAlpha=.55;
  x.beginPath();x.ellipse(cx-s*0.48,cy+s*0.16,s*0.15,s*0.1,0,0,7);x.fill();
  x.beginPath();x.ellipse(cx+s*0.48,cy+s*0.16,s*0.15,s*0.1,0,0,7);x.fill();
  x.globalAlpha=1;

  // 눈
  const ey=cy-s*0.13, ex=s*0.32;
  x.strokeStyle=INK;x.fillStyle=INK;x.lineWidth=lw*0.9;
  [-1,1].forEach(d=>{
    const px=cx+ex*d, e=(spec.eyes==="wink"&&d===1)?"happy":spec.eyes;
    if(e==="dot"){x.beginPath();x.arc(px,ey,s*0.1,0,7);x.fill()}
    else if(e==="wide"){x.beginPath();x.arc(px,ey,s*0.14,0,7);x.fill();
      x.fillStyle="#fff";x.beginPath();x.arc(px+s*0.05,ey-s*0.05,s*0.05,0,7);x.fill();x.fillStyle=INK}
    else if(e==="sparkle"){x.beginPath();x.arc(px,ey,s*0.12,0,7);x.fill();
      x.fillStyle="#fff";x.beginPath();x.arc(px+s*0.045,ey-s*0.045,s*0.045,0,7);x.fill();x.fillStyle=INK}
    else if(e==="happy"){x.beginPath();x.arc(px,ey+s*0.04,s*0.12,Math.PI*1.12,Math.PI*1.88);x.stroke()}
    else if(e==="sleepy"){x.beginPath();x.moveTo(px-s*0.12,ey);x.quadraticCurveTo(px,ey+s*0.08,px+s*0.12,ey);x.stroke()}
    else if(e==="star"){star(x,px,ey,s*0.16,s*0.07,5);x.fill()}
  });

  // 입
  const my=cy+s*0.3;
  x.lineWidth=lw*0.9;x.strokeStyle=INK;
  if(spec.mouth==="smile"){x.beginPath();x.arc(cx,my-s*0.08,s*0.15,Math.PI*0.15,Math.PI*0.85);x.stroke()}
  else if(spec.mouth==="grin"){x.beginPath();x.arc(cx,my-s*0.1,s*0.2,Math.PI*0.1,Math.PI*0.9);
    x.fillStyle=mixc(A,INK,.35);x.fill();x.stroke()}
  else if(spec.mouth==="o"){x.beginPath();x.ellipse(cx,my,s*0.09,s*0.12,0,0,7);
    x.fillStyle=mixc(A,INK,.35);x.fill();x.stroke()}
  else if(spec.mouth==="w"){x.beginPath();x.arc(cx-s*0.08,my-s*0.04,s*0.08,Math.PI*0.1,Math.PI*0.9);x.stroke();
    x.beginPath();x.arc(cx+s*0.08,my-s*0.04,s*0.08,Math.PI*0.1,Math.PI*0.9);x.stroke()}
  else if(spec.mouth==="line"){x.beginPath();x.moveTo(cx-s*0.1,my);x.lineTo(cx+s*0.1,my);x.stroke()}
  else if(spec.mouth==="wave"){x.beginPath();x.moveTo(cx-s*0.15,my);
    x.quadraticCurveTo(cx-s*0.05,my-s*0.09,cx,my);x.quadraticCurveTo(cx+s*0.05,my+s*0.09,cx+s*0.15,my);x.stroke()}

  // 소품
  drawProp(x,spec.prop,cx+s*1.0,cy+s*0.35,s*0.42,A,lw);
  x.restore();
}

function sparkle(x,px,py,r){
  x.beginPath();
  x.moveTo(px,py-r);x.quadraticCurveTo(px,py,px+r,py);
  x.quadraticCurveTo(px,py,px,py+r);x.quadraticCurveTo(px,py,px-r,py);
  x.quadraticCurveTo(px,py,px,py-r);x.closePath();x.fill();
}
function heart(x,px,py,r){
  x.beginPath();x.moveTo(px,py+r*0.75);
  x.bezierCurveTo(px-r*1.5,py-r*0.35,px-r*0.5,py-r*1.1,px,py-r*0.35);
  x.bezierCurveTo(px+r*0.5,py-r*1.1,px+r*1.5,py-r*0.35,px,py+r*0.75);
  x.closePath();
}
function star(x,px,py,R,r,n){
  x.beginPath();
  for(let i=0;i<n*2;i++){const a=Math.PI/n*i-Math.PI/2, rad=i%2?r:R;
    i?x.lineTo(px+Math.cos(a)*rad,py+Math.sin(a)*rad):x.moveTo(px+Math.cos(a)*rad,py+Math.sin(a)*rad)}
  x.closePath();
}
function drawProp(x,kind,px,py,s,A,lw){
  x.save();x.lineWidth=lw*0.85;x.strokeStyle=INK;x.fillStyle=A;x.lineJoin="round";
  if(kind==="heart"){heart(x,px,py,s*0.62);x.fill();x.stroke()}
  else if(kind==="star"){star(x,px,py,s*0.7,s*0.3,5);x.fill();x.stroke()}
  else if(kind==="moon"){
    x.beginPath();x.arc(px,py,s*0.62,Math.PI*0.32,Math.PI*1.5);
    x.quadraticCurveTo(px-s*0.1,py,px+Math.cos(Math.PI*0.32)*s*0.62,py+Math.sin(Math.PI*0.32)*s*0.62);
    x.closePath();x.fill();x.stroke()}
  else if(kind==="cup"){
    rr(x,px-s*0.5,py-s*0.42,s,s*0.9,s*0.14);x.fill();x.stroke();
    x.beginPath();x.arc(px+s*0.6,py-s*0.02,s*0.2,-1.2,1.2);x.stroke();
    x.beginPath();x.moveTo(px-s*0.2,py-s*0.62);x.quadraticCurveTo(px-s*0.05,py-s*0.8,px-s*0.2,py-s*0.98);x.stroke()}
  else if(kind==="laptop"){
    rr(x,px-s*0.55,py-s*0.55,s*1.1,s*0.72,s*0.08);x.fill();x.stroke();
    rr(x,px-s*0.72,py+s*0.17,s*1.44,s*0.2,s*0.08);x.fillStyle=mixc(A,PAPER,.5);x.fill();x.stroke()}
  else if(kind==="clock"){
    x.beginPath();x.arc(px,py,s*0.62,0,7);x.fill();x.stroke();
    x.beginPath();x.moveTo(px,py);x.lineTo(px,py-s*0.36);x.moveTo(px,py);x.lineTo(px+s*0.26,py+s*0.1);x.stroke()}
  else if(kind==="camera"){
    rr(x,px-s*0.62,py-s*0.42,s*1.24,s*0.86,s*0.12);x.fill();x.stroke();
    x.beginPath();x.arc(px,py,s*0.26,0,7);x.fillStyle=mixc(A,PAPER,.45);x.fill();x.stroke()}
  x.restore();
}

/* ══════════════════════════════════════════
   온도계
   ══════════════════════════════════════════ */
function drawThermo(x,cx,top,bot,w,val,A,unit){
  const r=w/2, bulbR=w*0.82, bulbCy=bot-bulbR;
  const tubeBot=bulbCy+8, zero=bulbCy-22, full=top+r*1.2;
  const lvl=zero-(zero-full)*val/100;

  x.save();x.lineJoin="round";
  // 관
  rr(x,cx-r,top,w,tubeBot-top,r);
  x.fillStyle="#fff";x.fill();x.lineWidth=9;x.strokeStyle=INK;x.stroke();
  // 수은
  rr(x,cx-r+9,lvl,w-18,Math.max(6,bulbCy-lvl),(w-18)/2);
  x.fillStyle=A;x.fill();
  // 구
  x.beginPath();x.arc(cx,bulbCy,bulbR,0,7);
  x.fillStyle=A;x.fill();x.lineWidth=9;x.strokeStyle=INK;x.stroke();
  // 눈금
  x.lineWidth=4;x.font='400 21px "DM Mono", monospace';x.textAlign="right";
  for(let p=0;p<=100;p+=20){
    const y=zero-(zero-full)*p/100;
    x.strokeStyle=INK;
    x.beginPath();x.moveTo(cx-r-6,y);x.lineTo(cx-r-(p%40?13:23),y);x.stroke();
    if(!(p%40)){x.fillStyle=SOFT;x.fillText(String(p),cx-r-30,y+7)}
  }
  x.textAlign="left";
  // 정확한 수치 지시선
  x.strokeStyle=INK;x.lineWidth=4;
  x.beginPath();x.moveTo(cx+r+6,lvl);x.lineTo(cx+r+28,lvl);x.stroke();
  x.fillStyle=INK;x.font='500 28px "DM Mono", monospace';
  x.fillText(val.toFixed(1)+unit, cx+r+38, lvl+10);
  x.restore();
}

/* ══ 상태 ══ */
let cur=null,qIdx=0,tally=[],meterSum=0,score=0,curR=null;
const $=id=>document.getElementById(id);
const S={home:$("home"),quiz:$("quiz"),result:$("result")};
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function show(n){Object.entries(S).forEach(([k,el])=>el.classList.toggle("hidden",k!==n));window.scrollTo({top:0,behavior:"instant"})}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._id);t._id=setTimeout(()=>t.classList.remove("on"),2400)}

function drawRack(){
  $("rack").innerHTML=TESTS.map((t,i)=>`
    <button class="card" data-ink="${t.ink}" data-id="${t.id}">
      <canvas width="150" height="150" id="thumb-${t.id}"></canvas>
      <div class="card-body">
        <div class="card-no">NO. ${String(i+1).padStart(2,"0")} · ${t.meter.label}</div>
        <h2>${t.title}</h2>
        <p>${t.blurb}</p>
      </div>
    </button>`).join("");
  TESTS.forEach(t=>{
    const c=$("thumb-"+t.id);if(!c)return;
    const x=c.getContext("2d");x.clearRect(0,0,150,150);
    drawChar(x,72,72,44,t.results["00"].char,t.accent);
  });
  document.querySelectorAll(".card").forEach(b=>b.addEventListener("click",()=>start(b.dataset.id)));
}

function start(id){
  cur=TESTS.find(t=>t.id===id);
  qIdx=0;meterSum=0;tally=cur.axes.map(()=>[0,0]);
  document.documentElement.style.setProperty("--riso-pink",cur.accent);
  show("quiz");renderQ();
}

function renderQ(){
  const q=cur.questions[qIdx];
  $("gaugeFill").style.width=(qIdx/cur.questions.length*100)+"%";
  $("gaugeTxt").textContent=`${cur.title} — ${String(qIdx+1).padStart(2,"0")} / ${String(cur.questions.length).padStart(2,"0")}`;
  $("qbody").innerHTML=`<h2 class="qtext">${q.q}</h2><div class="choices">${
    q.opts.map((o,i)=>`<button class="choice" data-side="${o.s}" data-v="${o.v}"><b>${String.fromCharCode(65+i)}</b><span>${o.t}</span></button>`).join("")}</div>`;
  $("qbody").querySelectorAll(".choice").forEach(b=>
    b.addEventListener("click",()=>answer(q.axis,+b.dataset.side,+b.dataset.v)));
}

function answer(axis,side,v){
  tally[axis][side]++;meterSum+=v;qIdx++;
  qIdx<cur.questions.length?renderQ():finish();
}

function finish(){
  const key=tally.map(a=>a[0]>=a[1]?"0":"1").join("");
  const r=cur.results[key];curR=r;
  score=Math.round(meterSum/cur.questions.length*10)/10;

  $("rStamp").textContent=`${cur.title} · 결과`;
  $("sLabel").textContent=cur.meter.label;
  $("sUnit").textContent=cur.meter.unit;
  $("sLow").textContent=`0 ${cur.meter.low}`;
  $("sHigh").textContent=`${cur.meter.high} 100`;
  $("rCode").textContent=r.code;
  const n=$("rName");n.innerHTML=r.name.replace(/\n/g,"<br>");n.setAttribute("data-text",r.name);
  $("rLine").textContent=r.line;
  $("rDesc").textContent=r.desc;
  $("rTraits").innerHTML=r.traits.map(t=>`<span>${t}</span>`).join("");
  $("rMatch").textContent=r.match;
  $("rWarn").textContent=r.warn;

  const cv=$("charView").getContext("2d");
  cv.clearRect(0,0,300,300);drawChar(cv,140,150,88,r.char,cur.accent);

  document.title=`${cur.meter.label} ${score}${cur.meter.unit} — ${r.name.replace(/\n/g," ")} | 유형연구소`;
  show("result");
  requestAnimationFrame(()=>$("sFill").style.width=score+"%");
  countUp(score);
  drawPoster(r);
  pushAds();
}

function countUp(target){
  const el=$("sNum");
  if(reduce){el.textContent=target.toFixed(1);return}
  const dur=1000,t0=performance.now();
  (function step(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=(target*e).toFixed(1);
    if(p<1)requestAnimationFrame(step);
  })(t0);
}

/* ══════════════════════════════════════════
   포스터 1080 × 1920
   ══════════════════════════════════════════ */
async function drawPoster(r){
  const c=$("poster"),x=c.getContext("2d");
  const W=1080,H=1920,A=cur.accent,M=90;

  try{
    await document.fonts.load('400 100px "Bagel Fat One"');
    await document.fonts.load('500 30px "DM Mono"');
    await document.fonts.load('600 40px "Pretendard Variable"');
    await document.fonts.ready;
  }catch(e){}

  x.fillStyle=PAPER;x.fillRect(0,0,W,H);

  // 강조색 잉크 얼룩
  for(let y=250;y<740;y+=13){
    const fade=1-Math.abs(y-495)/280;
    for(let i=M;i<W-M;i+=13){
      x.fillStyle=A;x.globalAlpha=.25*Math.max(0,fade);
      x.beginPath();x.arc(i,y,3.4,0,7);x.fill();
    }
  }
  x.globalAlpha=1;

  // 먹 망점
  x.fillStyle="rgba(34,25,66,0.09)";
  for(let y=0;y<H;y+=12)for(let i=0;i<W;i+=12){x.beginPath();x.arc(i,y,1.4,0,7);x.fill()}

  x.strokeStyle=INK;x.lineWidth=7;x.strokeRect(44,44,W-88,H-88);

  // 등록 마크
  [A,"#4C7CF7","#FFC44D","#2FCFB4"].forEach((col,i)=>{
    x.fillStyle=col;x.fillRect(M+i*46,104,34,34);
    x.strokeStyle=INK;x.lineWidth=4;x.strokeRect(M+i*46,104,34,34);
  });
  x.fillStyle=SOFT;x.font='500 24px "DM Mono", monospace';
  x.textAlign="right";x.fillText("유형연구소 / TYPE LAB",W-M,128);x.textAlign="left";

  x.fillStyle=INK;x.font='600 34px "Pretendard Variable", sans-serif';
  x.fillText(cur.title,M,236);

  // 캐릭터 + 온도계
  drawChar(x,330,502,166,r.char,A);
  drawThermo(x,788,286,706,72,score,A,cur.meter.unit);

  // 수치
  x.fillStyle=SOFT;x.font='500 28px "DM Mono", monospace';
  x.fillText(cur.meter.label.toUpperCase(),M,806);

  const num=score.toFixed(1);
  x.font='400 168px "Bagel Fat One", sans-serif';
  const nW=x.measureText(num).width;
  x.globalAlpha=.9;x.fillStyle=A;x.fillText(num,M-14,946);
  x.globalAlpha=1;x.fillStyle=INK;x.fillText(num,M,932);
  x.font='400 66px "Bagel Fat One", sans-serif';
  x.fillStyle=A;x.fillText(cur.meter.unit,M+nW+18,932);
  x.fillStyle=SOFT;x.font='400 26px "DM Mono", monospace';
  x.fillText(`0 ${cur.meter.low}  —  ${cur.meter.high} 100`,M,982);

  x.strokeStyle=INK;x.lineWidth=5;
  x.beginPath();x.moveTo(M,1030);x.lineTo(W-M,1030);x.stroke();

  // 유형
  x.fillStyle=A;x.font='500 34px "DM Mono", monospace';
  x.fillText(r.code,M,1090);

  const lines=r.name.split("\n");
  const longest=Math.max(...lines.map(l=>l.length));
  const tS=Math.max(92,Math.min(122,122-(longest-4)*11));
  x.font=`400 ${tS}px "Bagel Fat One", sans-serif`;
  let y=1090+tS*0.92+22;
  lines.forEach(l=>{
    x.globalAlpha=.9;x.fillStyle=A;x.fillText(l,M-12,y+12);
    x.globalAlpha=1;x.fillStyle=INK;x.fillText(l,M,y);
    y+=tS*1.04;
  });

  x.fillStyle=INK;x.font='600 40px "Pretendard Variable", sans-serif';
  y=wrap(x,r.line,M,y+30,W-M*2,54);

  let cxp=M,cyp=y+46;
  x.font='500 27px "DM Mono", monospace';
  r.traits.forEach(t=>{
    const w=x.measureText(t).width+42;
    if(cxp+w>W-M){cxp=M;cyp+=74}
    x.strokeStyle=INK;x.lineWidth=5;x.strokeRect(cxp,cyp,w,58);
    x.fillStyle=INK;x.fillText(t,cxp+21,cyp+39);
    cxp+=w+16;
  });

  x.fillStyle=A;x.fillRect(M,H-198,W-M*2,12);
  x.fillStyle=INK;x.font='400 44px "Bagel Fat One", sans-serif';
  x.fillText(`너는 몇 ${cur.meter.unit==="°C"?"도":"점"}?`,M,H-126);
  x.fillStyle=SOFT;x.font='400 26px "DM Mono", monospace';
  x.textAlign="right";x.fillText(location.host||"type-lab.example.com",W-M,H-126);
  x.textAlign="left";
}

function wrap(x,text,left,top,maxW,lh){
  let line="",y=top;
  for(const ch of text){
    if(x.measureText(line+ch).width>maxW&&line){x.fillText(line,left,y);line=ch;y+=lh}
    else line+=ch;
  }
  if(line){x.fillText(line,left,y);y+=lh}
  return y;
}

function posterBlob(){return new Promise(res=>$("poster").toBlob(res,"image/png"))}

$("btnSave").addEventListener("click",async()=>{
  const b=await posterBlob();if(!b)return toast("이미지를 만들지 못했습니다.");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=`유형연구소_${cur.id}_${score}.png`;
  a.click();URL.revokeObjectURL(a.href);
  toast("포스터를 저장했습니다.");
});

$("btnShare").addEventListener("click",async()=>{
  const b=await posterBlob();if(!b)return toast("이미지를 만들지 못했습니다.");
  const f=new File([b],"type.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],text:`${cur.meter.label} ${score}${cur.meter.unit} 나왔다`})}
    catch(e){if(e.name!=="AbortError")toast("공유를 완료하지 못했습니다.")}
  }else{
    try{await navigator.clipboard.writeText(location.href);toast("이 기기는 이미지 공유를 지원하지 않아 링크를 복사했습니다.")}
    catch(e){toast("저장 버튼으로 이미지를 받아 공유해 주세요.")}
  }
});

$("btnAgain").addEventListener("click",()=>{
  document.title="유형연구소 — 오늘의 나를 인쇄합니다";
  $("sFill").style.width="0";show("home");
});
$("btnBack").addEventListener("click",()=>show("home"));

function pushAds(){
  document.querySelectorAll("#result ins.adsbygoogle").forEach(el=>{
    if(el.dataset.done)return;el.dataset.done="1";
    try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}
  });
}

drawRack();
document.querySelectorAll("#home ins.adsbygoogle").forEach(()=>{
  try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}
});
</script>
