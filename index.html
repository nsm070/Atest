<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제어기 통합 시뮬레이터</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      margin-bottom: 2rem;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: fadeInDown 0.8s ease-out;
    }

    .emoji {
      display: inline-block;
      animation: bounce 2s infinite;
      margin-right: 1rem;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .nav-button {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1rem 2rem;
      border-radius: 50px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .nav-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .nav-button:hover::before {
      left: 100%;
    }

    .nav-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      background: rgba(255, 255, 255, 0.15);
    }

    .nav-button.active {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tab {
      display: none;
      animation: fadeIn 0.5s ease-out;
    }

    .tab.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .tab-content {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      font-weight: 600;
      color: white;
      margin-bottom: 2rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .control-group {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    .control-group:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .control-value {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      min-width: 60px;
      text-align: center;
    }

    .slider {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      transition: all 0.3s ease;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      transition: all 0.3s ease;
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
    }

    .slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      border: none;
      transition: all 0.3s ease;
    }

    .slider::-moz-range-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      margin-top: 2rem;
      position: relative;
      overflow: hidden;
    }

    .chart-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.02) 50%, transparent 70%);
      pointer-events: none;
    }

    canvas {
      max-width: 100%;
      height: 400px !important;
      border-radius: 12px;
    }

    .status-indicator {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.7;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .parameter-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
    }

    .info-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      cursor: help;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .controls-grid {
        grid-template-columns: 1fr;
      }
      
      .nav-button {
        padding: 0.8rem 1.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1><span class="emoji">🔧</span>제어기 통합 시뮬레이터</h1>

  <nav>
    <button class="nav-button active" onclick="showTab('pid')">PID 제어기</button>
    <button class="nav-button" onclick="showTab('lqr')">LQR 제어기</button>
  </nav>

  <div id="pid" class="tab active">
    <div class="tab-content">
      <div class="status-indicator"></div>
      <h2>PID 제어기</h2>
      
      <div class="controls-grid">
        <div class="control-group">
          <div class="parameter-info">
            <span class="info-icon">P</span>
            <span>비례 제어 - 현재 오차에 비례하여 제어</span>
          </div>
          <div class="control-label">
            <span>Kp (비례 게인)</span>
            <span class="control-value" id="kpVal">2.0</span>
          </div>
          <input type="range" class="slider" id="Kp" min="0" max="10" step="0.1" value="2.0" />
        </div>

        <div class="control-group">
          <div class="parameter-info">
            <span class="info-icon">I</span>
            <span>적분 제어 - 누적된 오차를 제거</span>
          </div>
          <div class="control-label">
            <span>Ki (적분 게인)</span>
            <span class="control-value" id="kiVal">1.0</span>
          </div>
          <input type="range" class="slider" id="Ki" min="0" max="5" step="0.1" value="1.0" />
        </div>

        <div class="control-group">
          <div class="parameter-info">
            <span class="info-icon">D</span>
            <span>미분 제어 - 오차 변화율을 예측</span>
          </div>
          <div class="control-label">
            <span>Kd (미분 게인)</span>
            <span class="control-value" id="kdVal">0.5</span>
          </div>
          <input type="range" class="slider" id="Kd" min="0" max="5" step="0.1" value="0.5" />
        </div>
      </div>

      <div class="chart-container">
        <canvas id="pidChart"></canvas>
      </div>
    </div>
  </div>

  <div id="lqr" class="tab">
    <div class="tab-content">
      <div class="status-indicator"></div>
      <h2>LQR 제어기</h2>
      
      <div class="controls-grid">
        <div class="control-group">
          <div class="parameter-info">
            <span class="info-icon">Q</span>
            <span>상태 오차에 대한 가중치</span>
          </div>
          <div class="control-label">
            <span>Q (상태 가중치)</span>
            <span class="control-value" id="qVal">1.0</span>
          </div>
          <input type="range" class="slider" id="Q" min="0.1" max="5.0" step="0.1" value="1.0" />
        </div>

        <div class="control-group">
          <div class="parameter-info">
            <span class="info-icon">R</span>
            <span>제어 입력에 대한 가중치</span>
          </div>
          <div class="control-label">
            <span>R (입력 가중치)</span>
            <span class="control-value" id="rVal">1.0</span>
          </div>
          <input type="range" class="slider" id="R" min="0.1" max="5.0" step="0.1" value="1.0" />
        </div>
      </div>

      <div class="chart-container">
        <canvas id="lqrChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function showTab(id) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

const t = Array.from({length: 500}, (_, i) => i * 0.02);
const dt = 0.02;
const zeta = 0.6;
const wn = 2.0;

// Chart.js 기본 설정
Chart.defaults.color = 'rgba(255, 255, 255, 0.8)';
Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';
Chart.defaults.backgroundColor = 'rgba(255, 255, 255, 0.05)';

// PID 시뮬레이션
function simulatePID(Kp, Ki, Kd) {
  let y = 0, y_dot = 0;
  let integral = 0;
  let prev_error = 1;
  const response = [];
  for (let i = 0; i < t.length; i++) {
    const error = 1 - y;
    integral += error * dt;
    const derivative = (error - prev_error) / dt;
    const u = Kp * error + Ki * integral + Kd * derivative;
    prev_error = error;
    const y_ddot = u - 2 * zeta * wn * y_dot - wn ** 2 * y;
    y_dot += y_ddot * dt;
    y += y_dot * dt;
    response.push(y);
  }
  return response;
}

const pidCtx = document.getElementById("pidChart").getContext("2d");
const pidChart = new Chart(pidCtx, {
  type: 'line',
  data: {
    labels: t,
    datasets: [
      {
        label: 'PID 응답',
        data: [],
        borderColor: 'rgba(255, 107, 107, 0.9)',
        backgroundColor: 'rgba(255, 107, 107, 0.1)',
        borderWidth: 3,
        fill: true,
        tension: 0.4,
        pointRadius: 0,
        pointHoverRadius: 6,
        pointHoverBorderWidth: 3,
        pointHoverBorderColor: '#fff'
      },
      {
        label: '목표값',
        data: Array(t.length).fill(1),
        borderColor: 'rgba(74, 222, 128, 0.9)',
        backgroundColor: 'rgba(74, 222, 128, 0.1)',
        borderWidth: 2,
        borderDash: [5, 5],
        fill: false,
        pointRadius: 0
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: {
      intersect: false,
      mode: 'index'
    },
    plugins: {
      legend: {
        labels: {
          usePointStyle: true,
          padding: 20,
          font: {
            size: 14,
            weight: '600'
          }
        }
      }
    },
    scales: {
      x: {
        title: {
          display: true,
          text: '시간 (초)',
          font: { size: 14, weight: '600' }
        },
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      },
      y: {
        title: {
          display: true,
          text: '출력 y(t)',
          font: { size: 14, weight: '600' }
        },
        min: -0.5,
        max: 2,
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      }
    }
  }
});

function updatePID() {
  const Kp = parseFloat(document.getElementById("Kp").value);
  const Ki = parseFloat(document.getElementById("Ki").value);
  const Kd = parseFloat(document.getElementById("Kd").value);
  document.getElementById("kpVal").textContent = Kp.toFixed(1);
  document.getElementById("kiVal").textContent = Ki.toFixed(1);
  document.getElementById("kdVal").textContent = Kd.toFixed(1);
  const y = simulatePID(Kp, Ki, Kd);
  pidChart.data.datasets[0].data = y;
  pidChart.update('none');
}

// LQR 시뮬레이션
const A = [[0, 1], [0, -1]];
const B = [[0], [1]];
const C = [1, 0];
const x0 = [1, 0];

function simulateLQR(Qval, Rval) {
  const K = [Qval, Rval];
  let x = [...x0];
  const output = [];
  for (let i = 0; i < t.length; i++) {
    const u = -K[0]*x[0] - K[1]*x[1];
    const dx1 = x[1];
    const dx2 = -x[1] + u;
    x[0] += dx1 * dt;
    x[1] += dx2 * dt;
    const y = C[0]*x[0] + C[1]*x[1];
    output.push(y);
  }
  return output;
}

const lqrCtx = document.getElementById("lqrChart").getContext("2d");
const lqrChart = new Chart(lqrCtx, {
  type: 'line',
  data: {
    labels: t,
    datasets: [
      {
        label: 'LQR 응답',
        data: [],
        borderColor: 'rgba(59, 130, 246, 0.9)',
        backgroundColor: 'rgba(59, 130, 246, 0.1)',
        borderWidth: 3,
        fill: true,
        tension: 0.4,
        pointRadius: 0,
        pointHoverRadius: 6,
        pointHoverBorderWidth: 3,
        pointHoverBorderColor: '#fff'
      },
      {
        label: '목표값',
        data: Array(t.length).fill(0),
        borderColor: 'rgba(74, 222, 128, 0.9)',
        backgroundColor: 'rgba(74, 222, 128, 0.1)',
        borderWidth: 2,
        borderDash: [5, 5],
        fill: false,
        pointRadius: 0
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: {
      intersect: false,
      mode: 'index'
    },
    plugins: {
      legend: {
        labels: {
          usePointStyle: true,
          padding: 20,
          font: {
            size: 14,
            weight: '600'
          }
        }
      }
    },
    scales: {
      x: {
        title: {
          display: true,
          text: '시간 (초)',
          font: { size: 14, weight: '600' }
        },
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      },
      y: {
        title: {
          display: true,
          text: '출력 y(t)',
          font: { size: 14, weight: '600' }
        },
        min: -0.5,
        max: 2,
        grid: {
          color: 'rgba(255, 255, 255, 0.1)'
        }
      }
    }
  }
});

function updateLQR() {
  const Q = parseFloat(document.getElementById("Q").value);
  const R = parseFloat(document.getElementById("R").value);
  document.getElementById("qVal").textContent = Q.toFixed(1);
  document.getElementById("rVal").textContent = R.toFixed(1);
  const y = simulateLQR(Q, R);
  lqrChart.data.datasets[0].data = y;
  lqrChart.update('none');
}

// 이벤트 리스너
document.querySelectorAll("input[type='range']").forEach(input => {
  input.addEventListener("input", () => {
    if (input.id.startsWith("K")) updatePID();
    if (input.id.startsWith("Q") || input.id.startsWith("R")) updateLQR();
  });
});

// 초기 업데이트
updatePID();
updateLQR();
</script>

</body>
</html>
