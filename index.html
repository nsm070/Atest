<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리의 50일 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0a0a0f;
      color: #f0eae0;
      overflow-x: hidden;
    }

    /* ===== STARS ===== */
    #stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) infinite alternate;
      opacity: var(--op, 0.5);
    }
    @keyframes twinkle {
      from { opacity: 0.1; }
      to { opacity: 0.9; }
    }

    /* ===== PETALS ===== */
    .petal {
      position: fixed;
      width: 8px; height: 12px;
      border-radius: 50% 0 50% 0;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
      opacity: 0.7;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .days-big {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(80px, 20vw, 160px);
      font-weight: 600;
      background: linear-gradient(135deg, #f9c5d1, #e8a4b8, #c97ba8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(233, 140, 170, 0.3)); }
      50%       { filter: drop-shadow(0 0 60px rgba(233, 140, 170, 0.7)); }
    }

    .days-label {
      font-size: clamp(16px, 4vw, 24px);
      color: #e8b4c8;
      letter-spacing: 0.3em;
      margin-top: -0.5rem;
      font-weight: 300;
    }

    .hero-subtitle {
      margin-top: 2rem;
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(18px, 4vw, 28px);
      color: #f5e6ee;
      font-weight: 300;
      line-height: 1.7;
    }

    .hero-date {
      margin-top: 1rem;
      font-size: 14px;
      color: #c4a0b4;
      letter-spacing: 0.2em;
    }

    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: #c4a0b4;
      font-size: 13px;
      letter-spacing: 0.2em;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(8px); }
    }

    /* ===== DIVIDER ===== */
    .divider {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 1rem;
      color: #e8a0b8;
      font-size: 20px;
      letter-spacing: 0.5em;
    }

    /* ===== SECTIONS ===== */
    .section {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .section-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 22px;
      color: #f9c5d1;
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 400;
      letter-spacing: 0.15em;
    }

    /* ===== LETTER ===== */
    .letter-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(233, 160, 184, 0.2);
      border-radius: 16px;
      padding: 2.5rem;
      font-family: 'Noto Serif KR', serif;
      font-size: 15px;
      line-height: 2;
      color: #f0e4ec;
      font-weight: 300;
      position: relative;
      overflow: hidden;
    }
    .letter-card::before {
      content: '"';
      position: absolute;
      top: 1rem; left: 1.5rem;
      font-size: 80px;
      color: rgba(233, 160, 184, 0.1);
      font-family: Georgia, serif;
      line-height: 1;
    }

    /* ===== TIMELINE ===== */
    .timeline {
      position: relative;
      padding-left: 2rem;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, #e8a0b8, transparent);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 2rem;
      padding-left: 1.5rem;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -2.35rem;
      top: 6px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e8a0b8;
      box-shadow: 0 0 10px rgba(232, 160, 184, 0.6);
    }
    .timeline-date {
      font-size: 12px;
      color: #c4a0b4;
      letter-spacing: 0.2em;
      margin-bottom: 0.3rem;
    }
    .timeline-text {
      font-size: 15px;
      color: #f0e4ec;
      line-height: 1.7;
      font-family: 'Noto Serif KR', serif;
      font-weight: 300;
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(233, 160, 184, 0.15);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: border-color 0.3s, background 0.3s;
    }
    .stat-card:hover {
      border-color: rgba(233, 160, 184, 0.4);
      background: rgba(233, 160, 184, 0.05);
    }
    .stat-number {
      font-family: 'Noto Serif KR', serif;
      font-size: 32px;
      color: #f9c5d1;
      font-weight: 600;
      display: block;
    }
    .stat-label {
      font-size: 12px;
      color: #c4a0b4;
      letter-spacing: 0.15em;
      margin-top: 0.3rem;
      display: block;
    }

    /* ===== PROMISES ===== */
    .promise-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .promise-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(233, 160, 184, 0.1);
      border-radius: 10px;
      font-size: 14px;
      color: #f0e4ec;
      line-height: 1.7;
      font-family: 'Noto Serif KR', serif;
      font-weight: 300;
    }
    .promise-icon {
      color: #e8a0b8;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ===== CLOSING ===== */
    .closing {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 4rem 2rem 6rem;
    }
    .closing-heart {
      font-size: 48px;
      animation: heartbeat 1.5s ease-in-out infinite;
      display: block;
      margin-bottom: 1.5rem;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.2); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.15); }
      56%       { transform: scale(1); }
    }
    .closing-text {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(20px, 4vw, 32px);
      color: #f5e6ee;
      font-weight: 300;
      line-height: 1.7;
    }
    .closing-name {
      margin-top: 1.5rem;
      font-size: 14px;
      color: #c4a0b4;
      letter-spacing: 0.3em;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .letter-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div id="stars"></div>
  <div id="petals"></div>

  <!-- HERO -->
  <section class="hero">
    <div class="days-big" id="counter">0</div>
    <div class="days-label">D A Y S</div>
    <div class="hero-subtitle" id="hero-subtitle">
      네가 내 곁에 있어온<br>소중한 날들
    </div>
    <div class="hero-date" id="hero-date"></div>
    <div class="scroll-hint">↓ scroll</div>
  </section>

  <div class="divider">· · ♡ · ·</div>

  <!-- LETTER -->
  <section class="section">
    <h2 class="section-title">✉ 나의 편지</h2>
    <div class="letter-card" id="letter-body">

      우리가 함께한 지 벌써 <span id="letter-days">50</span>일이 지났어.<br>

      네 목소리를 들으면 하루가 따뜻해지는 걸 느껴.<br><br>
      앞으로도 100일, 200일, 그
