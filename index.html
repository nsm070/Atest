<style>
/* ══════════════════════════════════════════
   토큰 — 리소그래프 4색 인쇄
   ══════════════════════════════════════════ */
:root{
  --paper:#E7E4F0;        /* 옅은 페리윙클 종이 */
  --paper-deep:#D8D3E8;
  --ink:#17143A;          /* 잉크 먹 */
  --ink-soft:#5B5680;
  --riso-pink:#FF3D7F;
  --riso-blue:#2C6CF6;
  --riso-yellow:#FFB627;
  --riso-mint:#00BFA6;

  --display:"Bagel Fat One", system-ui, sans-serif;
  --body:"Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, monospace;

  --shift:5px;            /* 인쇄 어긋남 폭 — 이 사이트의 시그니처 */
  --edge:3px solid var(--ink);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}

/* 망점 텍스처 — 종이 위에 얹힌 인쇄망 */
body::before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none; z-index:9999;
  background-image:radial-gradient(circle at center, rgba(23,20,58,.16) 1px, transparent 1.1px);
  background-size:5px 5px;
  mix-blend-mode:multiply;
  opacity:.55;
}

.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* ── 머리말 ────────────────────────────── */
.masthead{padding:26px 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:-.01em;line-height:1}
.brand em{font-style:normal;color:var(--riso-pink)}
.plate{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}

/* ── 어긋난 겹인쇄 활자 (시그니처) ──────── */
.overprint{position:relative;display:inline-block;font-family:var(--display);line-height:1.02;letter-spacing:-.02em}
.overprint::before{
  content:attr(data-text);
  position:absolute; left:calc(var(--shift) * -1); top:var(--shift);
  color:var(--riso-pink);
  mix-blend-mode:multiply;
  z-index:-1;
  white-space:pre-wrap;
}
.overprint.blue::before{color:var(--riso-blue)}
.overprint.mint::before{color:var(--riso-mint)}
.overprint.yellow::before{color:var(--riso-yellow)}

/* ── 표지 ──────────────────────────────── */
.cover{padding:18px 0 34px}
.cover h1{font-size:clamp(40px,12.5vw,68px);margin-bottom:20px}
.cover p{font-size:15px;color:var(--ink-soft);max-width:30ch}

.regbar{display:flex;gap:0;height:9px;margin:26px 0 8px;border:var(--edge)}
.regbar span{flex:1}
.regbar span:nth-child(1){background:var(--riso-pink)}
.regbar span:nth-child(2){background:var(--riso-blue)}
.regbar span:nth-child(3){background:var(--riso-yellow)}
.regbar span:nth-child(4){background:var(--riso-mint)}

/* ── 테스트 목록 ───────────────────────── */
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-soft);margin:30px 0 14px;text-transform:uppercase}

.rack{display:grid;gap:14px;padding-bottom:8px}

.card{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--paper);border:var(--edge);border-radius:0;
  padding:20px 18px;position:relative;
  font:inherit;color:inherit;
  transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s;
  box-shadow:var(--shift) var(--shift) 0 var(--ink);
}
.card:hover,.card:focus-visible{transform:translate(calc(var(--shift) * -1), calc(var(--shift) * -1));box-shadow:calc(var(--shift) * 2) calc(var(--shift) * 2) 0 var(--ink)}
.card:active{transform:translate(0,0);box-shadow:0 0 0 var(--ink)}
.card:focus-visible{outline:3px solid var(--riso-blue);outline-offset:4px}

.card-no{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-soft)}
.card h2{font-family:var(--display);font-size:26px;line-height:1.15;margin:6px 0 6px;font-weight:400}
.card p{font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.card .meta{font-family:var(--mono);font-size:10.5px;margin-top:12px;letter-spacing:.06em}

.card[data-ink="pink"]{background:color-mix(in srgb, var(--riso-pink) 13%, var(--paper))}
.card[data-ink="blue"]{background:color-mix(in srgb, var(--riso-blue) 12%, var(--paper))}
.card[data-ink="yellow"]{background:color-mix(in srgb, var(--riso-yellow) 20%, var(--paper))}
.card[data-ink="mint"]{background:color-mix(in srgb, var(--riso-mint) 14%, var(--paper))}

/* ── 문항 화면 ─────────────────────────── */
.quiz-top{padding:20px 0 6px;display:flex;align-items:center;gap:12px}
.back{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px 0}
.back:hover{color:var(--ink)}

.gauge{height:9px;border:var(--edge);display:flex;overflow:hidden;margin:8px 0 4px}
.gauge i{display:block;background:var(--riso-pink);width:0;transition:width .3s cubic-bezier(.2,.8,.3,1)}
.gauge-txt{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:26px}

.qbody{animation:slidein .28s cubic-bezier(.2,.8,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.qtext{font-family:var(--display);font-size:clamp(24px,7vw,34px);line-height:1.3;font-weight:400;margin-bottom:26px}

.choices{display:grid;gap:12px}
.choice{
  font:inherit;text-align:left;cursor:pointer;
  background:var(--paper);border:var(--edge);
  padding:17px 18px;font-size:15.5px;line-height:1.45;
  display:flex;gap:13px;align-items:flex-start;
  transition:transform .13s, background .13s;
}
.choice:hover,.choice:focus-visible{background:var(--paper-deep);transform:translateX(4px)}
.choice:focus-visible{outline:3px solid var(--riso-blue);outline-offset:3px}
.choice b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink-soft);padding-top:3px;flex:none}

/* ── 결과 화면 ─────────────────────────── */
.result-head{padding:22px 0 0}
.stamp{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;border:2px solid var(--ink);padding:5px 10px;margin-bottom:18px}
.type-code{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--riso-pink);margin-bottom:4px}
.type-name{font-size:clamp(38px,11.5vw,60px);margin-bottom:16px}
.type-line{font-size:16px;font-weight:600;margin-bottom:10px}
.type-desc{font-size:15px;color:var(--ink-soft);margin-bottom:24px}

.traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.traits span{font-family:var(--mono);font-size:11.5px;border:2px solid var(--ink);padding:5px 10px;letter-spacing:.04em}

.panel{border:var(--edge);padding:16px 17px;margin-bottom:12px;box-shadow:var(--shift) var(--shift) 0 var(--ink)}
.panel h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:7px;font-weight:400}
.panel p{font-size:14.5px;line-height:1.6}
.panel.good{background:color-mix(in srgb, var(--riso-mint) 15%, var(--paper))}
.panel.warn{background:color-mix(in srgb, var(--riso-yellow) 22%, var(--paper))}

.preview{width:100%;border:var(--edge);margin:26px 0 16px;display:block;background:var(--paper)}

.actions{display:grid;gap:11px;margin-bottom:30px}
.btn{
  font:inherit;font-weight:700;font-size:15.5px;cursor:pointer;
  padding:16px;border:var(--edge);background:var(--paper);color:var(--ink);
  box-shadow:var(--shift) var(--shift) 0 var(--ink);
  transition:transform .13s, box-shadow .13s;
}
.btn:hover,.btn:focus-visible{transform:translate(calc(var(--shift) * -1), calc(var(--shift) * -1));box-shadow:calc(var(--shift) * 2) calc(var(--shift) * 2) 0 var(--ink)}
.btn:active{transform:translate(0,0);box-shadow:0 0 0}
.btn:focus-visible{outline:3px solid var(--riso-blue);outline-offset:4px}
.btn.primary{background:var(--riso-pink);color:#fff}
.btn.ghost{box-shadow:none;background:transparent;font-weight:500}
.btn.ghost:hover{transform:none;box-shadow:none;background:var(--paper-deep)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);
  background:var(--ink);color:var(--paper);padding:12px 20px;
  font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
  z-index:10000;opacity:0;transition:all .28s cubic-bezier(.2,.8,.3,1);
  pointer-events:none;max-width:calc(100% - 36px);text-align:center;
}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ── 광고 자리 ─────────────────────────── */
.adslot{margin:28px 0;min-height:1px}
.adslot ins{display:block}

/* ── 꼬리말 ────────────────────────────── */
footer{border-top:var(--edge);margin-top:34px;padding:20px 0 42px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.05em;line-height:1.9}

.hidden{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .card:hover,.btn:hover,.choice:hover{transform:none}
}
</style>
</head>

/* ══ 상태 ══ */
let cur=null, qIdx=0, tally=[];

const $=id=>document.getElementById(id);
const S={home:$("home"),quiz:$("quiz"),result:$("result")};

function show(name){
  Object.entries(S).forEach(([k,el])=>el.classList.toggle("hidden",k!==name));
  window.scrollTo({top:0,behavior:"instant"});
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._id); t._id=setTimeout(()=>t.classList.remove("on"),2400);
}

/* ══ 목록 그리기 ══ */
function drawRack(){
  $("rack").innerHTML = TESTS.map((t,i)=>`
    <button class="card" data-ink="${t.ink}" data-id="${t.id}">
      <div class="card-no">NO. ${String(i+1).padStart(2,"0")}</div>
      <h2>${t.title}</h2>
      <p>${t.blurb}</p>
      <div class="meta">${t.questions.length}문항 · ${Object.keys(t.results).length}가지 유형</div>
    </button>`).join("");
  document.querySelectorAll(".card").forEach(b=>
    b.addEventListener("click",()=>start(b.dataset.id)));
}

/* ══ 시작 ══ */
function start(id){
  cur=TESTS.find(t=>t.id===id);
  qIdx=0;
  tally=cur.axes.map(()=>[0,0]);
  document.documentElement.style.setProperty("--riso-pink",cur.accent);
  show("quiz"); renderQ();
}

function renderQ(){
  const q=cur.questions[qIdx];
  const pct=(qIdx/cur.questions.length)*100;
  $("gaugeFill").style.width=pct+"%";
  $("gaugeTxt").textContent=`${cur.title} — ${String(qIdx+1).padStart(2,"0")} / ${String(cur.questions.length).padStart(2,"0")}`;
  $("qbody").innerHTML=`
    <h2 class="qtext">${q.q}</h2>
    <div class="choices">
      ${q.opts.map((o,i)=>`<button class="choice" data-side="${o.s}"><b>${String.fromCharCode(65+i)}</b><span>${o.t}</span></button>`).join("")}
    </div>`;
  $("qbody").querySelectorAll(".choice").forEach(b=>
    b.addEventListener("click",()=>answer(q.axis,+b.dataset.side)));
}

function answer(axis,side){
  tally[axis][side]++;
  qIdx++;
  if(qIdx<cur.questions.length){ renderQ(); }
  else finish();
}

function finish(){
  const key=tally.map(a=>a[0]>=a[1]?"0":"1").join("");
  const r=cur.results[key];
  const flat=r.name.replace(/\n/g," ");

  $("rStamp").textContent=`${cur.title} · 결과`;
  $("rCode").textContent=r.code;
  const nameEl=$("rName");
  nameEl.innerHTML=r.name.replace(/\n/g,"<br>");
  nameEl.setAttribute("data-text",r.name);
  $("rLine").textContent=r.line;
  $("rDesc").textContent=r.desc;
  $("rTraits").innerHTML=r.traits.map(t=>`<span>${t}</span>`).join("");
  $("rMatch").textContent=r.match;
  $("rWarn").textContent=r.warn;

  document.title=`${flat} — ${cur.title} | 유형연구소`;
  show("result");
  drawPoster(r);
  pushAds();
}

/* ══════════════════════════════════════════
   결과 포스터 — 브라우저에서 그립니다 (서버비 0)
   1080 × 1920, 인스타 스토리 비율
   ══════════════════════════════════════════ */
async function drawPoster(r){
  const c=$("poster"), x=c.getContext("2d");
  const W=1080,H=1920, A=cur.accent, INK="#17143A", PAPER="#E7E4F0";

  try{
    await document.fonts.load('400 100px "Bagel Fat One"');
    await document.fonts.load('500 30px "DM Mono"');
    await document.fonts.ready;
  }catch(e){}

  x.fillStyle=PAPER; x.fillRect(0,0,W,H);

  // 망점
  x.fillStyle="rgba(23,20,58,0.11)";
  for(let y=0;y<H;y+=11) for(let i=0;i<W;i+=11){
    x.beginPath(); x.arc(i,y,1.5,0,7); x.fill();
  }

  // 테두리
  x.strokeStyle=INK; x.lineWidth=8;
  x.strokeRect(48,48,W-96,H-96);

  // 레지스터 바
  const cols=[A,"#2C6CF6","#FFB627","#00BFA6"];
  cols.forEach((col,i)=>{ x.fillStyle=col; x.fillRect(96+i*222,110,222,20); });
  x.strokeStyle=INK; x.lineWidth=5; x.strokeRect(96,110,888,20);

  // 머리말
  x.fillStyle=INK; x.font='500 27px "DM Mono", monospace';
  x.fillText("유형연구소 / TYPE LAB", 96, 205);
  x.font='400 30px "Pretendard Variable", sans-serif';
  x.fillText(cur.title, 96, 253);

  // 코드
  x.fillStyle=A; x.font='500 40px "DM Mono", monospace';
  x.fillText(r.code, 96, 400);

  // 유형 이름 — 겹인쇄 어긋남
  const lines=r.name.split("\n");
  const size=Math.min(150, 150 - (Math.max(...lines.map(l=>l.length))-4)*12);
  x.font=`400 ${size}px "Bagel Fat One", sans-serif`;
  let ny=400+size+40;
  lines.forEach(l=>{
    x.globalAlpha=.85; x.fillStyle=A; x.fillText(l, 96-14, ny+14);
    x.globalAlpha=1;   x.fillStyle=INK; x.fillText(l, 96, ny);
    ny+=size*1.06;
  });

  // 한 줄 요약
  x.fillStyle=INK; x.font='600 40px "Pretendard Variable", sans-serif';
  let ty=ny+40;
  ty=wrap(x, r.line, 96, ty, W-192, 56);

  // 설명
  x.fillStyle="#5B5680"; x.font='400 33px "Pretendard Variable", sans-serif';
  ty=wrap(x, r.desc, 96, ty+34, W-192, 50);

  // 특성 칩
  let cx=96, cy=ty+70;
  x.font='500 27px "DM Mono", monospace';
  r.traits.forEach(t=>{
    const w=x.measureText(t).width+42;
    if(cx+w>W-96){ cx=96; cy+=74; }
    x.strokeStyle=INK; x.lineWidth=5; x.strokeRect(cx,cy,w,58);
    x.fillStyle=INK; x.fillText(t, cx+21, cy+39);
    cx+=w+16;
  });

  // 꼬리말
  x.fillStyle=A; x.fillRect(96,H-230,888,10);
  x.fillStyle=INK; x.font='500 32px "DM Mono", monospace';
  x.fillText("너는 몇 번?", 96, H-165);
  x.font='400 27px "DM Mono", monospace';
  x.fillStyle="#5B5680";
  x.fillText(location.host || "type-lab.example.com", 96, H-118);
}

function wrap(x,text,left,top,maxW,lh){
  let line="", y=top;
  for(const ch of text){
    if(x.measureText(line+ch).width>maxW && line){ x.fillText(line,left,y); line=ch; y+=lh; }
    else line+=ch;
  }
  if(line){ x.fillText(line,left,y); y+=lh; }
  return y;
}

/* ══ 저장 / 공유 ══ */
function posterBlob(){
  return new Promise(res=>$("poster").toBlob(res,"image/png"));
}

$("btnSave").addEventListener("click", async ()=>{
  const b=await posterBlob(); if(!b) return toast("이미지를 만들지 못했습니다.");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=`유형연구소_${cur.id}.png`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("포스터를 저장했습니다.");
});

$("btnShare").addEventListener("click", async ()=>{
  const b=await posterBlob(); if(!b) return toast("이미지를 만들지 못했습니다.");
  const file=new File([b],"type.png",{type:"image/png"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text:`${cur.title} 결과 나왔다`}); }
    catch(e){ if(e.name!=="AbortError") toast("공유를 완료하지 못했습니다."); }
  }else{
    try{
      await navigator.clipboard.writeText(location.href);
      toast("이 기기는 이미지 공유를 지원하지 않아 링크를 복사했습니다.");
    }catch(e){ toast("저장 버튼으로 이미지를 받아 공유해 주세요."); }
  }
});

$("btnAgain").addEventListener("click",()=>{ document.title="유형연구소 — 오늘의 나를 인쇄합니다"; show("home"); });
$("btnBack").addEventListener("click",()=>show("home"));

/* ══ 광고 ══ */
function pushAds(){
  document.querySelectorAll("#result ins.adsbygoogle").forEach(el=>{
    if(el.dataset.done) return;
    el.dataset.done="1";
    try{ (window.adsbygoogle=window.adsbygoogle||[]).push({}); }catch(e){}
  });
}

drawRack();
document.querySelectorAll("#home ins.adsbygoogle").forEach(()=>{
  try{ (window.adsbygoogle=window.adsbygoogle||[]).push({}); }catch(e){}
});
